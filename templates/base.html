<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Wesley Corpus{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="/">Wesley Corpus</a></h1>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span class="hamburger"></span>
      </button>
      <nav id="nav-menu">
        <a href="https://historyofmethodism.com" class="back-link">&larr; Podcast</a>
        <a href="/search">Search</a>
        <a href="/themes">Themes</a>
        <a href="/scripture">Scripture</a>
        <a href="/random">Random</a>
        <a href="/strangely-warmed">SWI</a>
      </nav>
    </div>
  </header>
  <script>
    document.querySelector('.nav-toggle').addEventListener('click', function() {
      const nav = document.getElementById('nav-menu');
      const expanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', !expanded);
      nav.classList.toggle('nav-open');
    });
  </script>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div class="container">Wesley Corpus &mdash; The writings of John &amp; Charles Wesley</div>
  </footer>
</body>
</html>
